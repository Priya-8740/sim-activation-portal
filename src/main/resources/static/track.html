
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Activation | SIM Portal</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #123b70;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000010;
        }

        h2 { color: #123b70; }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #123b70;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        #result {
            margin-top: 22px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #123b70;
        }
    </style>
</head>

<body>
    <header>
        <h1>SIM Activation Portal</h1>
        <p>Track Your Request</p>
    </header>

    <main class="container">
        <a class="back" href="/">← Back to Home</a>

        <section class="card">
            <h2>Track Activation Status</h2>

            <form id="trackForm">
                <label for="requestId">Activation Request ID</label>
                <input type="number" id="requestId"
                       min="1" placeholder="Enter your Request ID"
                       required>

                <button type="submit">Check Status</button>
            </form>

            <div id="result" role="status" aria-live="polite">
                Enter your Request ID to check the status.
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("trackForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const requestId =
                document.getElementById("requestId").value;

            result.textContent = "Checking request status...";

            try {
                const response = await fetch(
                    "/api/activations/" + encodeURIComponent(requestId)
                );

                if (response.status === 404) {
                    result.textContent =
                        "Request not found. Please check the Request ID.";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Unable to retrieve request details.");
                }

                const data = await response.json();

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = "Activation Request Details";

                const id = document.createElement("p");
                id.textContent = "Request ID: " + data.id;

                const status = document.createElement("p");
                status.textContent = "Status: " + data.status;

                const date = document.createElement("p");
                date.textContent = "Request Date: " + data.requestDate;

                const customer = document.createElement("p");
                customer.textContent =
                    "Customer: " + data.customer.fullName;

                const sim = document.createElement("p");
                sim.textContent =
                    "SIM Number: " + data.simCard.simNumber;

                result.append(heading, id, status, date, customer, sim);

            } catch (error) {
                result.textContent = error.message;
            }
        });
    </script>
</body>
</html>
